{% extends "base.html" %}
{% block title %}{{ 'Ubah' if p else 'Tambah' }} Pelanggan{% endblock %}
{% block content %}
<h4 class="mb-3">{{ 'Ubah' if p else 'Tambah' }} Pelanggan</h4>
<form method="post" class="card shadow-sm p-4" style="max-width:560px">
  <div class="mb-3"><label class="form-label">Nama</label>
    <input class="form-control" name="nama" value="{{ p.nama if p else '' }}" required></div>
  <div class="mb-3"><label class="form-label">Nomor WhatsApp</label>
    <input class="form-control" name="no_whatsapp" value="{{ p.no_whatsapp if p else '' }}" placeholder="08xxxxxxxxxx" required></div>
  <div class="mb-3"><label class="form-label">Alamat</label>
    <input class="form-control" name="alamat" value="{{ p.alamat if p and p.alamat else '' }}"></div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="is_member" id="m" {{ 'checked' if p and p.is_member }}>
    <label class="form-check-label" for="m">Member</label></div>
  <div><button class="btn btn-primary">Simpan</button>
       <a class="btn btn-link" href="{{ url_for('pelanggan_list') }}">Batal</a></div>
</form>
{% endblock %}
